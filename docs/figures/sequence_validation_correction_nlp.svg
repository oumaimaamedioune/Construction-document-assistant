<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7b1e27"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#25252a}.title{font-size:30px;font-weight:700}.head{font-size:18px;font-weight:700}.msg{font-size:16px}.box{fill:#f7e8ea;stroke:#b62330;stroke-width:2}.life{stroke:#aaa;stroke-width:1.5;stroke-dasharray:8 7}.arrow{stroke:#7b1e27;stroke-width:2;marker-end:url(#a)}.return{stroke:#555;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#a)}.frag{fill:#fffaf9;stroke:#b62330;stroke-width:1.5}</style></defs>
 <rect width="1600" height="1050" fill="#fff"/><rect width="1600" height="14" fill="#b62330"/><text x="800" y="62" text-anchor="middle" class="title">Diagramme de séquence — Contrôle et correction des entités NLP</text>
 <circle cx="110" cy="130" r="26" fill="none" stroke="#25252a" stroke-width="3"/><line x1="110" y1="156" x2="110" y2="220" stroke="#25252a" stroke-width="3"/><line x1="75" y1="178" x2="145" y2="178" stroke="#25252a" stroke-width="3"/><line x1="110" y1="220" x2="78" y2="260" stroke="#25252a" stroke-width="3"/><line x1="110" y1="220" x2="142" y2="260" stroke="#25252a" stroke-width="3"/><text x="110" y="290" text-anchor="middle" class="head">Technicien</text>
 <rect x="245" y="105" rx="12" width="240" height="75" class="box"/><text x="365" y="148" text-anchor="middle" class="head">Interface Streamlit</text><rect x="565" y="105" rx="12" width="280" height="75" class="box"/><text x="705" y="137" text-anchor="middle" class="head">Service de validation</text><text x="705" y="160" text-anchor="middle" class="head">humaine</text><rect x="930" y="105" rx="12" width="225" height="75" class="box"/><text x="1042" y="148" text-anchor="middle" class="head">Base SQLite</text><rect x="1240" y="105" rx="12" width="235" height="75" class="box"/><text x="1357" y="148" text-anchor="middle" class="head">Service d’évaluation</text>
 <line x1="110" y1="300" x2="110" y2="995" class="life"/><line x1="365" y1="180" x2="365" y2="995" class="life"/><line x1="705" y1="180" x2="705" y2="995" class="life"/><line x1="1042" y1="180" x2="1042" y2="995" class="life"/><line x1="1357" y1="180" x2="1357" y2="995" class="life"/>
 <line x1="110" y1="330" x2="363" y2="330" class="arrow"/><text x="236" y="318" text-anchor="middle" class="msg">1. Sélectionner un extrait à contrôler</text><line x1="365" y1="390" x2="112" y2="390" class="return"/><text x="238" y="378" text-anchor="middle" class="msg">2. Afficher texte source et entités détectées</text>
 <rect x="70" y="430" width="810" height="250" class="frag"/><path d="M70 430h190v34H70z" fill="#f3dadd"/><text x="84" y="453" class="head">Choix du technicien</text><text x="100" y="500" class="msg">A. Valider : toutes les entités sont correctes et rien ne manque</text><text x="100" y="548" class="msg">B. Corriger : signaler une valeur incorrecte</text><text x="100" y="596" class="msg">C. Compléter : ajouter une information importante oubliée</text><line x1="110" y1="640" x2="363" y2="640" class="arrow"/><text x="236" y="628" text-anchor="middle" class="msg">3. Envoyer la décision</text>
 <line x1="365" y1="715" x2="703" y2="715" class="arrow"/><text x="534" y="703" text-anchor="middle" class="msg">4. Transmettre la validation</text><line x1="705" y1="765" x2="367" y2="765" class="return"/><text x="536" y="753" text-anchor="middle" class="msg">5. Proposer le résultat corrigé automatiquement</text><line x1="365" y1="815" x2="112" y2="815" class="return"/><text x="238" y="803" text-anchor="middle" class="msg">6. Afficher la correction à confirmer</text><line x1="110" y1="865" x2="703" y2="865" class="arrow"/><text x="406" y="853" text-anchor="middle" class="msg">7. Confirmer l’enregistrement</text><line x1="705" y1="915" x2="1040" y2="915" class="arrow"/><text x="872" y="903" text-anchor="middle" class="msg">8. Sauvegarder décision, correction et historique</text><line x1="1042" y1="965" x2="1355" y2="965" class="arrow"/><text x="1198" y="953" text-anchor="middle" class="msg">9. Recalculer précision, rappel et F1</text>
</svg>
