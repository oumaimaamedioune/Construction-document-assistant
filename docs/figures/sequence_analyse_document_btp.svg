<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7b1e27"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#25252a}.title{font-size:30px;font-weight:700}.head{font-size:18px;font-weight:700}.msg{font-size:16px}.small{font-size:14px;fill:#666}.box{fill:#f7e8ea;stroke:#b62330;stroke-width:2}.life{stroke:#aaa;stroke-width:1.5;stroke-dasharray:8 7}.arrow{stroke:#7b1e27;stroke-width:2;marker-end:url(#a)}.return{stroke:#555;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#a)}.act{fill:#b62330;opacity:.13;stroke:#b62330}</style></defs>
  <rect width="1600" height="1050" fill="#fff"/><rect x="0" y="0" width="1600" height="14" fill="#b62330"/>
  <text x="800" y="62" text-anchor="middle" class="title">Diagramme de séquence — Analyse d’un document BTP</text>
  <circle cx="110" cy="130" r="26" fill="none" stroke="#25252a" stroke-width="3"/><line x1="110" y1="156" x2="110" y2="220" stroke="#25252a" stroke-width="3"/><line x1="75" y1="178" x2="145" y2="178" stroke="#25252a" stroke-width="3"/><line x1="110" y1="220" x2="78" y2="260" stroke="#25252a" stroke-width="3"/><line x1="110" y1="220" x2="142" y2="260" stroke="#25252a" stroke-width="3"/><text x="110" y="290" text-anchor="middle" class="head">Technicien</text>
  <g><rect x="230" y="105" rx="12" width="245" height="75" class="box"/><text x="352" y="137" text-anchor="middle" class="head">Interface</text><text x="352" y="160" text-anchor="middle" class="head">Streamlit</text></g>
  <g><rect x="545" y="105" rx="12" width="275" height="75" class="box"/><text x="682" y="137" text-anchor="middle" class="head">Service d’analyse</text><text x="682" y="160" text-anchor="middle" class="head">documentaire</text></g>
  <g><rect x="895" y="105" rx="12" width="235" height="75" class="box"/><text x="1012" y="148" text-anchor="middle" class="head">Moteur NLP BTP</text></g>
  <g><rect x="1220" y="105" rx="12" width="235" height="75" class="box"/><text x="1337" y="137" text-anchor="middle" class="head">Base de données</text><text x="1337" y="160" text-anchor="middle" class="head">SQLite</text></g>
  <line x1="110" y1="300" x2="110" y2="995" class="life"/><line x1="352" y1="180" x2="352" y2="995" class="life"/><line x1="682" y1="180" x2="682" y2="995" class="life"/><line x1="1012" y1="180" x2="1012" y2="995" class="life"/><line x1="1337" y1="180" x2="1337" y2="995" class="life"/>
  <line x1="110" y1="330" x2="350" y2="330" class="arrow"/><text x="230" y="318" text-anchor="middle" class="msg">1. Déposer un fichier PDF</text>
  <line x1="352" y1="390" x2="680" y2="390" class="arrow"/><text x="516" y="378" text-anchor="middle" class="msg">2. Transmettre le document</text>
  <rect x="670" y="420" width="24" height="250" class="act"/><text x="706" y="448" class="msg">3. Lire le PDF et compter les pages</text><text x="706" y="500" class="msg">4. Détecter la famille documentaire</text><text x="706" y="552" class="msg">5. Appliquer l’extracteur spécialisé</text>
  <line x1="694" y1="610" x2="1010" y2="610" class="arrow"/><text x="852" y="598" text-anchor="middle" class="msg">6. Reconnaître et normaliser les entités</text>
  <line x1="1012" y1="660" x2="696" y2="660" class="return"/><text x="852" y="648" text-anchor="middle" class="msg">7. Retourner les entités normalisées</text>
  <text x="706" y="718" class="msg">8. Construire les preuves : document, page et texte source</text>
  <line x1="682" y1="770" x2="354" y2="770" class="return"/><text x="518" y="758" text-anchor="middle" class="msg">9. Retourner l’aperçu structuré et les preuves</text>
  <line x1="352" y1="825" x2="112" y2="825" class="return"/><text x="232" y="813" text-anchor="middle" class="msg">10. Afficher l’analyse avant enregistrement</text>
  <line x1="110" y1="885" x2="350" y2="885" class="arrow"/><text x="230" y="873" text-anchor="middle" class="msg">11. Confirmer l’intégration au corpus</text>
  <line x1="352" y1="945" x2="1335" y2="945" class="arrow"/><text x="844" y="933" text-anchor="middle" class="msg">12. Enregistrer le document, les extractions, les entités et les preuves</text>
</svg>
