<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7b1e27"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#25252a}.title{font-size:30px;font-weight:700}.head{font-size:18px;font-weight:700}.msg{font-size:16px}.box{fill:#f7e8ea;stroke:#b62330;stroke-width:2}.life{stroke:#aaa;stroke-width:1.5;stroke-dasharray:8 7}.arrow{stroke:#7b1e27;stroke-width:2;marker-end:url(#a)}.return{stroke:#555;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#a)}.frag{fill:#fffaf9;stroke:#b62330;stroke-width:1.5}</style></defs>
 <rect width="1600" height="1100" fill="#fff"/><rect width="1600" height="14" fill="#b62330"/><text x="800" y="62" text-anchor="middle" class="title">Diagramme de séquence — Recherche documentaire avec le chatbot</text>
 <circle cx="120" cy="130" r="26" fill="none" stroke="#25252a" stroke-width="3"/><line x1="120" y1="156" x2="120" y2="220" stroke="#25252a" stroke-width="3"/><line x1="85" y1="178" x2="155" y2="178" stroke="#25252a" stroke-width="3"/><line x1="120" y1="220" x2="88" y2="260" stroke="#25252a" stroke-width="3"/><line x1="120" y1="220" x2="152" y2="260" stroke="#25252a" stroke-width="3"/><text x="120" y="290" text-anchor="middle" class="head">Utilisateur</text>
 <rect x="280" y="105" rx="12" width="245" height="75" class="box"/><text x="402" y="148" text-anchor="middle" class="head">Interface Streamlit</text><rect x="645" y="105" rx="12" width="270" height="75" class="box"/><text x="780" y="137" text-anchor="middle" class="head">Assistant</text><text x="780" y="160" text-anchor="middle" class="head">documentaire</text><rect x="1070" y="105" rx="12" width="290" height="75" class="box"/><text x="1215" y="137" text-anchor="middle" class="head">SQLite et corpus</text><text x="1215" y="160" text-anchor="middle" class="head">documentaire local</text>
 <line x1="120" y1="300" x2="120" y2="1040" class="life"/><line x1="402" y1="180" x2="402" y2="1040" class="life"/><line x1="780" y1="180" x2="780" y2="1040" class="life"/><line x1="1215" y1="180" x2="1215" y2="1040" class="life"/>
 <line x1="120" y1="325" x2="400" y2="325" class="arrow"/><text x="260" y="313" text-anchor="middle" class="msg">1. Saisir une question et un filtre facultatif</text><line x1="402" y1="380" x2="778" y2="380" class="arrow"/><text x="590" y="368" text-anchor="middle" class="msg">2. Transmettre la requête</text><text x="805" y="430" class="msg">3. Détecter l’intention et normaliser la question</text>
 <rect x="620" y="460" width="690" height="210" class="frag"/><path d="M620 460h180v34H620z" fill="#f3dadd"/><text x="635" y="483" class="head">Accès hybride</text><text x="650" y="530" class="msg">A. Données structurées : postes DQE, quantités, prix et montants</text><text x="650" y="577" class="msg">B. Recherche textuelle : clauses, normes, matériaux et passages PDF</text><line x1="780" y1="625" x2="1213" y2="625" class="arrow"/><text x="996" y="613" text-anchor="middle" class="msg">4. Interroger les données et les passages</text>
 <line x1="1215" y1="710" x2="782" y2="710" class="return"/><text x="998" y="698" text-anchor="middle" class="msg">5. Retourner les preuves candidates</text><text x="805" y="755" class="msg">6. Classer les preuves et contrôler leur fiabilité</text>
 <rect x="615" y="790" width="710" height="150" class="frag"/><path d="M615 790h120v34H615z" fill="#f3dadd"/><text x="630" y="813" class="head">Alternative</text><text x="645" y="855" class="msg">Preuves fiables : construire une réponse avec sources [S1], [S2]…</text><text x="645" y="902" class="msg">Preuves insuffisantes : indiquer clairement qu’aucune preuve fiable n’a été trouvée</text>
 <line x1="780" y1="970" x2="404" y2="970" class="return"/><text x="592" y="958" text-anchor="middle" class="msg">7. Retourner la réponse et les sources</text><line x1="402" y1="1015" x2="122" y2="1015" class="return"/><text x="262" y="1003" text-anchor="middle" class="msg">8. Afficher la réponse contextuelle</text><line x1="120" y1="1060" x2="1213" y2="1060" class="arrow"/><text x="666" y="1048" text-anchor="middle" class="msg">9. Enregistrer la question, la réponse et la réaction utile / à améliorer</text>
</svg>
