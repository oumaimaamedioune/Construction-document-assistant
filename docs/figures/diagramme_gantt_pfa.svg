<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30272b"/>
      <stop offset="1" stop-color="#b92332"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#51222a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#f8e9eb}
      .month{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#70232f}
      .week{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#73777d}
      .task{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#282b30}
      .date{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#74777c}
      .bartext{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .legend{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#4c4f54}
    </style>
  </defs>

  <rect width="1600" height="960" fill="#f7f6f7"/>
  <rect x="42" y="35" width="1516" height="112" rx="22" fill="url(#header)" filter="url(#shadow)"/>
  <text x="78" y="84" class="title">Planification du projet PFA</text>
  <text x="78" y="119" class="subtitle">Assistant intelligent d’analyse de documents BTP — Ménara Préfa — Juillet à août 2026</text>

  <rect x="42" y="174" width="1516" height="690" rx="18" fill="#fff" stroke="#e6e1e3" filter="url(#shadow)"/>
  <rect x="56" y="188" width="532" height="72" rx="10" fill="#f2edef"/>
  <text x="78" y="218" class="month">Tâches réalisées</text>
  <text x="78" y="244" class="date">Organisation chronologique du stage</text>

  <rect x="610" y="188" width="450" height="34" rx="8" fill="#f5e6e8"/>
  <rect x="1060" y="188" width="450" height="34" rx="8" fill="#f5e6e8"/>
  <text x="835" y="211" text-anchor="middle" class="month">JUILLET 2026</text>
  <text x="1285" y="211" text-anchor="middle" class="month">AOÛT 2026</text>

  <g class="week" text-anchor="middle">
    <text x="654" y="246">S1</text><text x="755" y="246">S2</text><text x="857" y="246">S3</text><text x="958" y="246">S4</text><text x="1045" y="246">S5</text>
    <text x="1104" y="246">S1</text><text x="1205" y="246">S2</text><text x="1307" y="246">S3</text><text x="1408" y="246">S4</text><text x="1490" y="246">S5</text>
  </g>

  <g stroke="#ece8e9" stroke-width="1">
    <line x1="610" y1="260" x2="610" y2="854"/><line x1="712" y1="260" x2="712" y2="854"/>
    <line x1="813" y1="260" x2="813" y2="854"/><line x1="915" y1="260" x2="915" y2="854"/>
    <line x1="1016" y1="260" x2="1016" y2="854"/><line x1="1060" y1="188" x2="1060" y2="854" stroke="#cdbdc1" stroke-width="2"/>
    <line x1="1162" y1="260" x2="1162" y2="854"/><line x1="1263" y1="260" x2="1263" y2="854"/>
    <line x1="1365" y1="260" x2="1365" y2="854"/><line x1="1466" y1="260" x2="1466" y2="854"/><line x1="1510" y1="260" x2="1510" y2="854"/>
  </g>

  <g fill="#fbfafb">
    <rect x="56" y="270" width="1454" height="48" rx="8"/><rect x="56" y="378" width="1454" height="48" rx="8"/>
    <rect x="56" y="486" width="1454" height="48" rx="8"/><rect x="56" y="594" width="1454" height="48" rx="8"/>
    <rect x="56" y="702" width="1454" height="48" rx="8"/><rect x="56" y="810" width="1454" height="40" rx="8"/>
  </g>

  <!-- Tâches -->
  <g>
    <text x="78" y="289" class="task">Découverte de Ménara Préfa et de son système d’information</text><text x="78" y="308" class="date">01–04 juillet</text>
    <rect x="610" y="278" width="58" height="26" rx="7" fill="#7a2735"/><text x="639" y="296" text-anchor="middle" class="bartext">4 j</text>

    <text x="78" y="343" class="task">Analyse du besoin métier et cadrage du sujet</text><text x="78" y="362" class="date">05–10 juillet</text>
    <rect x="668" y="332" width="87" height="26" rx="7" fill="#7a2735"/><text x="711" y="350" text-anchor="middle" class="bartext">6 j</text>

    <text x="78" y="397" class="task">Élaboration et validation du cahier des charges</text><text x="78" y="416" class="date">11–17 juillet</text>
    <rect x="755" y="386" width="102" height="26" rx="7" fill="#7a2735"/><text x="806" y="404" text-anchor="middle" class="bartext">7 j</text>

    <text x="78" y="451" class="task">Recherche : documents BTP et datasets NLP</text><text x="78" y="470" class="date">18–21 juillet</text>
    <rect x="857" y="440" width="58" height="26" rx="7" fill="#d08045"/><text x="886" y="458" text-anchor="middle" class="bartext">4 j</text>

    <text x="78" y="505" class="task">Corpus, extraction CCTP/DQE et pipeline initial</text><text x="78" y="524" class="date">22–31 juillet</text>
    <rect x="915" y="494" width="145" height="26" rx="7" fill="#b92332"/><text x="987" y="512" text-anchor="middle" class="bartext">10 j</text>

    <text x="78" y="559" class="task">Base SQLite, entités NLP, tests et premières métriques</text><text x="78" y="578" class="date">01–07 août</text>
    <rect x="1060" y="548" width="102" height="26" rx="7" fill="#b92332"/><text x="1111" y="566" text-anchor="middle" class="bartext">7 j</text>

    <text x="78" y="613" class="task">Contrats, guide métier, reportage et interface Streamlit</text><text x="78" y="632" class="date">08–14 août</text>
    <rect x="1162" y="602" width="102" height="26" rx="7" fill="#b92332"/><text x="1213" y="620" text-anchor="middle" class="bartext">7 j</text>

    <text x="78" y="667" class="task">Rapprochement CCTP↔DQE et validation humaine</text><text x="78" y="686" class="date">15–20 août</text>
    <rect x="1264" y="656" width="87" height="26" rx="7" fill="#5d6770"/><text x="1307" y="674" text-anchor="middle" class="bartext">6 j</text>

    <text x="78" y="721" class="task">Analyse de nouveaux documents et chatbot documentaire</text><text x="78" y="740" class="date">21–26 août</text>
    <rect x="1351" y="710" width="87" height="26" rx="7" fill="#5d6770"/><text x="1394" y="728" text-anchor="middle" class="bartext">6 j</text>

    <text x="78" y="775" class="task">Stabilisation, anti-hallucination, design et tests finaux</text><text x="78" y="794" class="date">27–29 août</text>
    <rect x="1438" y="764" width="44" height="26" rx="7" fill="#5d6770"/><text x="1460" y="782" text-anchor="middle" class="bartext">3 j</text>

    <text x="78" y="829" class="task">Rapport, documentation et préparation de la démonstration</text><text x="78" y="848" class="date">30–31 août</text>
    <rect x="1482" y="818" width="28" height="26" rx="7" fill="#318b62"/><text x="1496" y="836" text-anchor="middle" class="bartext">2</text>
  </g>

  <!-- Légende -->
  <g transform="translate(78 905)">
    <rect x="0" y="-12" width="18" height="18" rx="5" fill="#7a2735"/><text x="28" y="2" class="legend">Cadrage</text>
    <rect x="145" y="-12" width="18" height="18" rx="5" fill="#d08045"/><text x="173" y="2" class="legend">Recherche</text>
    <rect x="305" y="-12" width="18" height="18" rx="5" fill="#b92332"/><text x="333" y="2" class="legend">Développement</text>
    <rect x="500" y="-12" width="18" height="18" rx="5" fill="#5d6770"/><text x="528" y="2" class="legend">IA, validation et stabilisation</text>
    <rect x="805" y="-12" width="18" height="18" rx="5" fill="#318b62"/><text x="833" y="2" class="legend">Finalisation</text>
  </g>
  <text x="1522" y="922" text-anchor="end" class="date">Période du stage : 01/07/2026 – 31/08/2026</text>
</svg>
